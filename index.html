<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hypercube Q₇ — Interactive Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Hypercube <span id="brand-n">Q₇</span></div>

      <div class="select-wrap">
        <label for="palette">Style</label>
        <select id="palette" class="field" aria-label="Color style"></select>
        <div class="palette-swatches" id="palette-swatches" aria-hidden="true"></div>
      </div>

      <div class="topbar-actions">
        <div class="select-wrap">
          <label for="png-scale">PNG</label>
          <select id="png-scale" class="field" aria-label="Screenshot scale">
            <option value="1">1×</option>
            <option value="2" selected>2×</option>
            <option value="3">3×</option>
          </select>
        </div>
        <button type="button" class="btn" id="btn-screenshot" title="Screenshot (S)">Screenshot</button>
        <button type="button" class="btn" id="btn-export" title="Export SVG (E)">Export SVG</button>
        <button type="button" class="btn" id="btn-copy-link" title="Copy shareable link">Copy link</button>
        <button type="button" class="btn primary" id="btn-reset" title="Reset (R)">Reset</button>
      </div>
    </header>

    <div class="main">
      <div class="stage-wrap">
        <div class="stage" id="stage" tabindex="0">
          <div class="stage-inner" id="stage-inner"></div>
        </div>
        <div class="stage-hud">
          <button type="button" class="btn" id="btn-fit">Fit</button>
          <button type="button" class="btn" id="btn-zoom-in">+</button>
          <button type="button" class="btn" id="btn-zoom-out">−</button>
        </div>
        <div class="hint">Scroll to zoom · drag to pan</div>
      </div>

      <aside class="sidebar" id="sidebar">
        <section class="section">
          <h2>Structure</h2>
          <div class="slider-block">
            <div class="slider-head">
              <label for="n">Dimensions</label>
              <input type="number" class="num" id="n-num" min="3" max="7" step="1" value="7" aria-label="Dimensions value">
            </div>
            <input type="range" id="n" min="3" max="7" step="1" value="7">
          </div>
          <div class="slider-block">
            <div class="slider-head">
              <label for="nest-scale">Nest scale (dim 4)</label>
              <input type="number" class="num" id="nest-scale-num" min="0.15" max="0.85" step="0.01" value="0.42" aria-label="Nest scale value">
            </div>
            <input type="range" id="nest-scale" min="0.15" max="0.85" step="0.01" value="0.42">
          </div>
          <div class="slider-block">
            <div class="slider-head">
              <label for="stretch-x">Horizontal stretch</label>
              <input type="number" class="num" id="stretch-x-num" min="0.6" max="2.5" step="0.01" value="1.45" aria-label="Horizontal stretch value">
            </div>
            <input type="range" id="stretch-x" min="0.6" max="2.5" step="0.01" value="1.45">
          </div>
        </section>

        <section class="section">
          <h2>Line lengths</h2>
          <div id="length-sliders"></div>
          <details class="advanced">
            <summary>Advanced angles</summary>
            <div id="angle-sliders"></div>
          </details>
        </section>

        <section class="section">
          <h2>Style</h2>
          <div class="toggle-row">
            <input type="checkbox" id="show-vertices" checked>
            <label for="show-vertices">Show vertices</label>
          </div>
          <div class="slider-block">
            <div class="slider-head">
              <label for="vertex-radius">Vertex radius</label>
              <input type="number" class="num" id="vertex-radius-num" min="0" max="6" step="0.1" value="1.5" aria-label="Vertex radius value">
            </div>
            <input type="range" id="vertex-radius" min="0" max="6" step="0.1" value="1.5">
          </div>
          <div class="slider-block">
            <div class="slider-head">
              <label for="stroke-width">Stroke width</label>
              <input type="number" class="num" id="stroke-width-num" min="0.2" max="4" step="0.05" value="0.9" aria-label="Stroke width value">
            </div>
            <input type="range" id="stroke-width" min="0.2" max="4" step="0.05" value="0.9">
          </div>
          <div class="slider-block">
            <div class="slider-head">
              <label for="glow">Glow</label>
              <input type="number" class="num" id="glow-num" min="0" max="8" step="0.1" value="0" aria-label="Glow value">
            </div>
            <input type="range" id="glow" min="0" max="8" step="0.1" value="0">
          </div>
        </section>

        <section class="section">
          <h2>Presets</h2>
          <div class="preset-row">
            <button type="button" class="btn" id="btn-preset-ref">Reference-like</button>
          </div>
          <div class="preset-row">
            <input type="text" id="preset-name" placeholder="Preset name" maxlength="40">
            <button type="button" class="btn primary" id="btn-preset-save">Save</button>
          </div>
          <div class="preset-list" id="preset-list"></div>
        </section>
      </aside>
    </div>
  </div>

  <div class="status-toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
